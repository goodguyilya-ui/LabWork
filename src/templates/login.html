{% extends "base.html" %}
{% block title %}Вход — Бронирование 2027{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8 mt-10">
    <h1 class="text-2xl font-bold text-indigo-700 mb-6 text-center">Вход в систему</h1>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="login">Логин</label>
            <input id="login" name="login" type="text" required autocomplete="username"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="Введите логин" />
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Пароль</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="Введите пароль" />
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
            Войти
        </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-500">
        Нет аккаунта?
        <a href="{{ url_for('register') }}" class="text-indigo-600 hover:underline font-medium">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
